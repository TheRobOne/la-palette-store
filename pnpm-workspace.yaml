packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

# pnpm 12+ (the equivalent package.json#pnpm.overrides field is no longer read)
overrides:
  "tsconfig-paths": "^4.2.0"

# pnpm 11+
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  "esbuild": true
  "msgpackr-extract": true
  "protobufjs": true

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"
  - "@swc/core"
  - "esbuild"
  - "msgpackr-extract"
  - "protobufjs"
